<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050b24">
<title>توقعات المباريات</title>
<style>
:root{
  --accent:#2f6bff; --accent2:#5ac8fa; --bg:#050b24; --ink:#ffffff;
  --mute:rgba(255,255,255,.62); --glass:rgba(255,255,255,.07); --line:rgba(255,255,255,.14);
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%}
body{
  color:var(--ink);background:var(--bg);overflow-x:hidden;line-height:1.5;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI","Tajawal","Cairo",Tahoma,sans-serif;
  padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
}
/* خلفية متحركة */
.bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;
  background:radial-gradient(90% 60% at 50% 105%,color-mix(in srgb,var(--accent) 55%,transparent),transparent 70%),
             radial-gradient(70% 50% at 0% 45%,color-mix(in srgb,var(--accent) 38%,transparent),transparent 70%)}
.orb{position:absolute;border-radius:50%;filter:blur(70px);opacity:.55;animation:drift 14s ease-in-out infinite alternate}
.o1{width:320px;height:320px;background:var(--accent);top:-80px;right:-90px}
.o2{width:300px;height:300px;background:var(--accent2);opacity:.28;bottom:-60px;left:-100px;animation-duration:18s}
.o3{width:220px;height:220px;background:#6a38e8;opacity:.3;top:45%;left:55%;animation-duration:22s}
@keyframes drift{to{transform:translate3d(-40px,50px,0) scale(1.15)}}

main{position:relative;z-index:1;max-width:440px;margin:0 auto;padding:22px 16px 40px}
.card{
  border-radius:40px;padding:8px;position:relative;
  background:linear-gradient(180deg,rgba(18,26,66,.92),rgba(8,12,38,.94));
  border:1px solid var(--line);
  box-shadow:0 40px 90px -20px color-mix(in srgb,var(--accent) 60%,transparent),0 0 0 6px rgba(255,255,255,.03),inset 0 1px 0 rgba(255,255,255,.18);
  backdrop-filter:blur(24px) saturate(160%);-webkit-backdrop-filter:blur(24px) saturate(160%);
  animation:float 6s ease-in-out infinite;
}
@keyframes float{50%{transform:translateY(-7px)}}

/* اللوحة العلوية */
.panel{
  position:relative;border-radius:32px 32px 120px 120px / 32px 32px 56px 56px;
  padding:16px 16px 64px;text-align:center;overflow:hidden;
  background:
    radial-gradient(70% 55% at 50% 0%,rgba(255,255,255,.35),transparent 70%),
    linear-gradient(165deg,color-mix(in srgb,var(--accent) 70%,#fff),var(--accent) 45%,color-mix(in srgb,var(--accent) 55%,#001));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.4),inset 0 -20px 40px rgba(0,10,60,.35);
}
.panel::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.14) 50%,transparent 65%);transform:translateX(-120%);animation:sheen 6s ease-in-out infinite}
@keyframes sheen{40%,100%{transform:translateX(120%)}}
.top{display:flex;justify-content:space-between;align-items:center;position:relative;z-index:2}
.tag{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:700;letter-spacing:.2px;
  padding:7px 14px;border-radius:980px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.28);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.dot{width:8px;height:8px;border-radius:50%;background:#5dff9a;box-shadow:0 0 10px #5dff9a;animation:blink 1.6s infinite}
@keyframes blink{50%{opacity:.35}}
.round{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;cursor:pointer;color:#fff;font:inherit;
  background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.28);transition:transform .15s}
.round:active{transform:scale(.9)}
.round svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.stage{position:relative;height:150px;margin-top:6px}
.ballwrap{position:absolute;left:50%;top:8px;width:116px;height:116px;margin-left:-58px;animation:bounce 1.8s cubic-bezier(.33,.75,.4,1) infinite}
.ballwrap svg{width:100%;height:100%;display:block;filter:drop-shadow(0 14px 12px rgba(0,10,50,.55))}
.ballspin{transform-origin:100px 100px;animation:spin 7s linear infinite}
.floor{position:absolute;left:50%;bottom:6px;width:90px;height:12px;margin-left:-45px;border-radius:50%;background:rgba(0,10,50,.55);filter:blur(5px);animation:shad 1.8s cubic-bezier(.33,.75,.4,1) infinite}
@keyframes bounce{0%,100%{transform:translateY(22px)}50%{transform:translateY(-6px)}}
@keyframes shad{0%,100%{transform:scale(1);opacity:.75}50%{transform:scale(.5);opacity:.3}}
@keyframes spin{to{transform:rotate(360deg)}}
h1{font-size:clamp(28px,8vw,36px);font-weight:800;letter-spacing:-.02em;line-height:1.25;position:relative;z-index:2;text-shadow:0 2px 18px rgba(0,20,90,.45)}
.sub{margin-top:8px;font-size:15px;color:rgba(255,255,255,.82);position:relative;z-index:2;padding:0 8px}

/* القنوات (دوائر / مربعات متوهجة) */
.tiles{display:flex;justify-content:center;flex-wrap:wrap;gap:14px;margin:-34px 8px 0;position:relative;z-index:3}
.tile{display:flex;flex-direction:column;align-items:center;gap:8px;text-decoration:none;color:var(--ink);width:76px}
.tile .ico{
  width:68px;height:68px;border-radius:22px;display:grid;place-items:center;position:relative;overflow:hidden;
  background:radial-gradient(90% 75% at 50% 112%,var(--g1),transparent 72%),linear-gradient(180deg,rgba(255,255,255,.12),rgba(255,255,255,.03)),#101634;
  border:1px solid rgba(255,255,255,.2);
  box-shadow:0 0 34px -4px var(--g2),0 10px 20px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.25);
  transition:transform .18s;animation:glow 3.2s ease-in-out infinite;animation-delay:calc(var(--i)*-.6s)
}
.tile:active .ico{transform:scale(.92)}
.tile:hover .ico{transform:translateY(-4px)}
.tile svg{width:30px;height:30px;stroke:#fff;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 6px rgba(255,255,255,.55))}
.tile .em{font-size:28px}
.tile span.lb{font-size:12px;font-weight:600;color:var(--mute);text-align:center;line-height:1.3;max-width:76px}
@keyframes glow{50%{box-shadow:0 0 46px 0 var(--g2),0 10px 20px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.25)}}

/* صف البروموكود */
.glass{margin:16px 8px 0;border-radius:24px;padding:14px 16px;background:linear-gradient(180deg,rgba(255,255,255,.1),rgba(255,255,255,.04));border:1px solid var(--line);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.12)}
.promo{display:flex;align-items:center;justify-content:space-between;gap:12px}
.promo small{display:block;color:var(--mute);font-size:13px}
.code{font-size:26px;font-weight:800;letter-spacing:3px;direction:ltr;text-align:right;margin-top:2px}
.copy{font:inherit;font-size:14px;font-weight:700;color:#fff;cursor:pointer;border:1px solid rgba(255,255,255,.28);padding:9px 18px;border-radius:980px;background:rgba(255,255,255,.1)}
.copy:active{transform:scale(.94)}

/* الأزرار السفلية */
.actions{display:flex;gap:10px;flex-wrap:wrap;margin:14px 8px 8px}
.pill{
  flex:1 1 150px;min-height:58px;display:flex;align-items:center;justify-content:center;gap:10px;padding:0 20px;border-radius:980px;
  font:inherit;font-size:17px;font-weight:700;text-decoration:none;color:#fff;position:relative;overflow:hidden;cursor:pointer;
  background:linear-gradient(180deg,rgba(255,255,255,.16),rgba(255,255,255,.05)),#1b2250;
  border:1px solid rgba(255,255,255,.2);box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 8px 20px rgba(0,0,0,.3);
  transition:transform .15s
}
.pill:active{transform:scale(.96)}
.pill svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.pill.main{
  flex:1.5 1 190px;border:0;
  background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 60%,#fff),var(--accent) 55%,color-mix(in srgb,var(--accent) 70%,#000));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.55),0 12px 34px color-mix(in srgb,var(--accent) 65%,transparent);
  animation:pulse 2.4s infinite
}
.pill.main::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.32) 50%,transparent 65%);transform:translateX(-130%);animation:sheen 4s ease-in-out infinite}
@keyframes pulse{0%{box-shadow:inset 0 1px 0 rgba(255,255,255,.55),0 0 0 0 color-mix(in srgb,var(--accent) 55%,transparent)}70%{box-shadow:inset 0 1px 0 rgba(255,255,255,.55),0 0 0 18px transparent}100%{box-shadow:inset 0 1px 0 rgba(255,255,255,.55),0 0 0 0 transparent}}

[hidden]{display:none!important}
#fx{position:absolute;inset:0;width:100%;height:100%}
/* الجوال */
.showcase{margin:18px 8px 0;display:flex;justify-content:center;padding-top:14px}
.showcase.crop{height:310px;overflow:hidden;-webkit-mask-image:linear-gradient(#000 68%,transparent);mask-image:linear-gradient(#000 68%,transparent)}
.phone{position:relative;flex:none;width:210px;aspect-ratio:9/19;border-radius:38px;padding:7px;
  background:linear-gradient(145deg,color-mix(in srgb,var(--accent) 55%,#fff),color-mix(in srgb,var(--accent) 45%,#10052a) 40%,#0b0720);
  box-shadow:0 30px 70px -10px color-mix(in srgb,var(--accent) 70%,transparent),inset 0 0 0 1px rgba(255,255,255,.4),inset 0 0 0 3px rgba(0,0,0,.35)}
.phone::before{content:"";position:absolute;left:-3px;top:92px;width:3px;height:38px;border-radius:2px;background:rgba(255,255,255,.35)}
.phone::after{content:"";position:absolute;right:-3px;top:120px;width:3px;height:58px;border-radius:2px;background:rgba(255,255,255,.35)}
.showcase.tilt .phone{transform:perspective(900px) rotateY(-16deg) rotateX(8deg) rotateZ(3deg);animation:phfloat 5s ease-in-out infinite}
@keyframes phfloat{50%{transform:perspective(900px) rotateY(-12deg) rotateX(6deg) rotateZ(2deg) translateY(-8px)}}
.notch{position:absolute;top:15px;left:50%;width:72px;height:21px;margin-left:-36px;border-radius:20px;background:#000;z-index:3}
.screen{position:relative;width:100%;height:100%;border-radius:32px;overflow:hidden;background:#fff}
.slide{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .8s}
.slide.on{opacity:1}
.showcase.plain .phone{width:100%;max-width:320px;aspect-ratio:4/5;padding:0;border-radius:26px;background:#000}
.showcase.plain .phone::before,.showcase.plain .phone::after,.showcase.plain .notch{display:none}
.showcase.plain .screen{border-radius:26px}
.fk{height:100%;padding:46px 14px 14px;color:#14102a;font-size:11px;text-align:right;background:linear-gradient(180deg,#fff 58%,color-mix(in srgb,var(--accent) 25%,#fff))}
.fk small{color:var(--accent);font-weight:700;font-size:12px}
.fk h4{font-size:17px;line-height:1.3;margin:6px 0 8px;font-weight:800}
.fk p{color:#555;font-size:10.5px;line-height:1.5}
.fk b{display:inline-block;margin:10px 0;background:#111;color:#fff;border-radius:980px;padding:7px 14px;font-size:11px}
.fk .cs{display:flex;gap:8px;margin-top:6px}
.fk .cs i{flex:1;height:70px;border-radius:14px;background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 70%,#fff),var(--accent2));opacity:.9}
body[data-bg]:not([data-bg=orbs]) .orb{opacity:.22}
body[data-bg=none] .orb{display:none}
.waves{position:absolute;left:0;right:0;bottom:0;height:38%;display:none;color:var(--accent)}
body[data-bg=waves] .waves{display:block}
.wave{position:absolute;left:0;bottom:0;width:200%;height:100%;fill:currentColor;opacity:.5;animation:wv 14s linear infinite}
.wave.w2{opacity:.35;height:80%;color:var(--accent2);animation-duration:20s;animation-direction:reverse}
.wave.w3{opacity:.25;height:60%;animation-duration:28s}
@keyframes wv{to{transform:translateX(-50%)}}
.pi{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-3px;margin-inline-end:6px;object-fit:contain}
.bonus{margin:12px 8px 0;border-radius:24px;padding:14px 16px;text-align:center;background:linear-gradient(180deg,rgba(255,255,255,.1),rgba(255,255,255,.04));border:1px solid var(--line);box-shadow:inset 0 1px 0 rgba(255,255,255,.12)}
.bonus p{font-size:15px;font-weight:700;line-height:1.7;margin-bottom:10px;white-space:pre-line}
.bonus .pill{width:100%;min-height:52px}
/* الهدية */
.gift{margin:12px 8px 0;border-radius:30px;padding:16px 14px 16px;text-align:center;position:relative;overflow:hidden;
  background:radial-gradient(80% 55% at 50% 0%,color-mix(in srgb,var(--accent) 60%,transparent),transparent 72%),linear-gradient(180deg,#0e1754,#080d33);
  border:1px solid var(--line);box-shadow:0 24px 50px -22px color-mix(in srgb,var(--accent) 75%,transparent),inset 0 1px 0 rgba(255,255,255,.16)}
.gbtn{display:block;margin:30px auto 0;width:178px;height:178px;padding:0;border:0;background:none;cursor:pointer;position:relative;color:inherit;border-radius:50%}
.gsvg{width:100%;height:100%;display:block;overflow:visible;animation:gfloat 3.6s ease-in-out infinite;filter:drop-shadow(0 16px 18px rgba(0,10,60,.5))}
@keyframes gfloat{0%,100%{transform:translateY(0) rotate(0)}45%{transform:translateY(-8px) rotate(0)}60%{transform:translateY(-8px) rotate(-4deg)}72%{transform:translateY(-8px) rotate(4deg)}84%{transform:translateY(-4px) rotate(0)}}
.glid{transform-origin:110px 112px;transition:transform .7s cubic-bezier(.3,1.5,.5,1)}
.gift.open .glid{transform:translate(26px,-62px) rotate(16deg)}
.gift.open .gsvg{animation:none}
.glight{position:absolute;left:50%;top:34%;width:150px;height:150px;margin:-75px 0 0 -75px;border-radius:50%;pointer-events:none;opacity:0;transform:scale(.3);transition:opacity .5s,transform .7s;
  background:radial-gradient(closest-side,rgba(255,238,160,.95),rgba(255,200,70,.35) 55%,transparent)}
.gift.open .glight{opacity:1;transform:scale(1.25)}
.gconf{position:absolute;inset:0;pointer-events:none;z-index:5}
.gconf i{position:absolute;left:50%;top:26%;width:8px;height:12px;border-radius:2px;opacity:0;animation:cf 1.3s cubic-bezier(.2,.8,.3,1) forwards}
@keyframes cf{0%{opacity:1;transform:translate(0,0) rotate(0)}65%{opacity:1}100%{opacity:0;transform:translate(var(--dx),calc(var(--dy) + 140px)) rotate(var(--r))}}
.gtitle{font-size:24px;font-weight:800;letter-spacing:.02em;margin-top:2px}
.gamt{font-size:68px;font-weight:900;line-height:1.25;padding-bottom:.05em;letter-spacing:-.03em;background:linear-gradient(180deg,#fff,color-mix(in srgb,var(--accent2) 60%,#fff));-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none;filter:drop-shadow(0 4px 18px color-mix(in srgb,var(--accent) 70%,transparent))}
.gsub{font-size:17px;color:rgba(255,255,255,.85);margin-top:2px}
.gcode{display:flex;align-items:center;justify-content:center;gap:10px;margin:14px auto 0;padding:9px 12px 9px 9px;border-radius:980px;max-width:330px;
  background:linear-gradient(180deg,rgba(255,255,255,.14),rgba(255,255,255,.04));border:1px solid rgba(255,255,255,.3);box-shadow:0 0 22px -6px var(--accent2)}
.gcode span{font-size:13px;color:rgba(255,255,255,.75)}
.gcode b{font-size:24px;font-weight:900;letter-spacing:2px;direction:ltr}
.gcode button{font:inherit;font-size:13px;font-weight:700;color:#fff;cursor:pointer;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.12);border-radius:980px;padding:6px 14px}
.ghint{margin-top:12px;font-size:14px;font-weight:700;color:#ffe48a;animation:blink 1.8s infinite}
.gift.open .ghint{display:none}
.greveal{display:grid;grid-template-rows:0fr;transition:grid-template-rows .55s ease}
.greveal>div{overflow:hidden}
.gift.open .greveal{grid-template-rows:1fr}
.greveal .pill{margin-top:14px;width:100%;min-height:54px;font-size:18px}
.gfeat{list-style:none;padding:0;margin:16px 0 0;display:grid;grid-template-columns:repeat(2,1fr);gap:10px 12px;text-align:start}
.gfeat li{font-size:11.5px;line-height:1.45;color:rgba(255,255,255,.72)}
.gfeat li::before{content:"– ";color:rgba(255,255,255,.55)}
.gfeat b{color:#fff;font-weight:800}.gfeat span{display:block}
/* البوسترات */
.posters{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin:16px 8px 0;padding-bottom:4px;scrollbar-width:none}
.posters::-webkit-scrollbar{display:none}
.poster{flex:0 0 100%;scroll-snap-align:center;position:relative;border-radius:28px;overflow:hidden;aspect-ratio:1/1;display:flex;flex-direction:column;align-items:center;text-align:center;
  padding:16px 14px 14px;color:#fff;text-decoration:none;isolation:isolate;border:1px solid rgba(255,255,255,.18);box-shadow:0 22px 44px -20px color-mix(in srgb,var(--accent) 70%,transparent)}
.posters.multi .poster{flex-basis:88%}
.poster.r45{aspect-ratio:4/5}
.pbg{position:absolute;inset:0;z-index:-2;background-size:cover;background-position:center;
  background-image:radial-gradient(70% 45% at 50% 28%,color-mix(in srgb,var(--accent) 85%,transparent),transparent 75%),linear-gradient(160deg,color-mix(in srgb,var(--accent) 55%,#000),#050b24)}
.pov{position:absolute;inset:0;z-index:-1}
.plogo{align-self:flex-start;font-weight:900;font-size:24px;font-style:italic;letter-spacing:-.02em;line-height:1;text-shadow:0 2px 12px rgba(0,0,0,.4)}
.plogo img{display:block;max-height:34px;max-width:120px;object-fit:contain}
.pmid{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;padding:6px 0}
.peye{font-size:15px;font-weight:700;letter-spacing:.06em;opacity:.95;text-shadow:0 2px 10px rgba(0,0,0,.45)}
.pbig{font-weight:900;line-height:1.05;letter-spacing:-.03em;text-shadow:0 6px 26px rgba(0,0,0,.45);white-space:nowrap;max-width:100%}
.psub{font-size:16px;opacity:.92;margin-top:2px;text-shadow:0 2px 10px rgba(0,0,0,.5)}
.pcode{display:inline-flex;align-items:center;gap:10px;margin-top:14px;padding:8px 18px;border-radius:980px;cursor:pointer;background:linear-gradient(180deg,rgba(255,255,255,.18),rgba(255,255,255,.05));
  border:1px solid rgba(255,255,255,.42);box-shadow:0 0 20px -4px var(--accent2);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.pcode em{font-style:normal;font-size:13px;opacity:.8}.pcode b{font-size:22px;font-weight:900;letter-spacing:2px;direction:ltr}
.pfeat{display:flex;gap:10px;width:100%;justify-content:space-between;margin-top:8px}
.pfeat div{flex:1;font-size:10.5px;line-height:1.4;text-align:start;opacity:.92}
.pfeat div::before{content:"– ";opacity:.6}.pfeat b{display:inline;font-weight:800}.pfeat span{display:block;opacity:.8}
.pfoot{margin-top:8px;font-size:12px;opacity:.85;letter-spacing:.03em}
.qrcard{display:flex;align-items:center;gap:10px;margin:16px 8px 8px;padding:22px 18px;border-radius:30px;position:relative;text-decoration:none;color:#fff;
  background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 78%,#fff),var(--accent) 50%,color-mix(in srgb,var(--accent) 70%,#000));
  box-shadow:0 0 50px -6px color-mix(in srgb,var(--accent) 80%,transparent),inset 0 1px 0 rgba(255,255,255,.4)}
.qtxt{flex:1.2;min-width:0;position:relative;z-index:2}
.qtxt h3{font-size:clamp(20px,6vw,26px);font-weight:800;line-height:1.3;margin:0 0 10px;white-space:pre-line}
.qtxt p{display:flex;gap:8px;align-items:flex-start;font-size:11.5px;line-height:1.55;color:rgba(255,255,255,.9)}
.qplus{flex:none;width:20px;height:20px;border-radius:50%;background:#fff;color:var(--accent);display:grid;place-items:center;font-style:normal;font-weight:800;font-size:15px;line-height:1}
.qtile{flex:none;width:116px;height:116px;border-radius:24px;background:linear-gradient(145deg,#fff,#dfe7ff);padding:14px;position:relative;z-index:2;
  transform:perspective(600px) rotateY(18deg) rotateX(-6deg) rotateZ(-6deg);box-shadow:-10px 14px 24px rgba(0,10,80,.4),inset 0 -4px 0 rgba(120,140,220,.35);
  color:color-mix(in srgb,var(--accent) 55%,#000);animation:qtile 5s ease-in-out infinite}
.qtile svg{width:100%;height:100%;display:block}
@keyframes qtile{50%{transform:perspective(600px) rotateY(14deg) rotateX(-4deg) rotateZ(-4deg) translateY(-6px)}}
.qplane{position:absolute;width:52px;height:52px;z-index:1;filter:drop-shadow(0 8px 8px rgba(0,10,80,.35));animation:qpl 6s ease-in-out infinite}
.qp1{left:-10px;top:-20px;rotate:-14deg}.qp2{left:92px;bottom:-22px;rotate:18deg;width:40px;height:40px;animation-delay:-2s}
@keyframes qpl{50%{translate:0 -7px}}

    var blocks=[],dv=divisor(eccLen);

    for(i=0;i<blocks[0].length;i++)blocks.forEach(function(b,j){if(i!==shortLen-eccLen||j>=nShort)all.push(b[i])});
    // مصفوفة الوحدات
    var size=ver*4+17,M=[],F=[];
    for(i=0;i<size;i++){M.push(new Array(size).fill(false));F.push(new Array(size).fill(false))}
    function setF(x,y,d){M[y][x]=d;F[y][x]=true}
    for(i=0;i<size;i++){setF(6,i,i%2===0);setF(i,6,i%2===0)}
    function finder(cx,cy){for(var dy=-4;dy<=4;dy++)for(var dx=-4;dx<=4;dx++){var x=cx+dx,y=cy+dy;
      if(x>=0&&x<size&&y>=0&&y<size){var d=Math.max(Math.abs(dx),Math.abs(dy));setF(x,y,d!==2&&d!==4)}}}
    finder(3,3);finder(size-4,3);finder(3,size-4);
    var ap=[];
    if(ver>1){var na=Math.floor(ver/7)+2,st=ver===32?26:Math.ceil((ver*4+4)/(na*2-2))*2;ap=[6];
      for(var pos=size-7;ap.length<na;pos-=st)ap.splice(1,0,pos)}
    for(i=0;i<ap.length;i++)for(var j2=0;j2<ap.length;j2++){
      if((i===0&&j2===0)||(i===0&&j2===ap.length-1)||(i===ap.length-1&&j2===0))continue;
      for(var dy=-2;dy<=2;dy++)for(var dx=-2;dx<=2;dx++)setF(ap[i]+dx,ap[j2]+dy,Math.max(Math.abs(dx),Math.abs(dy))!==1)}
    function fmt(mask){
      var d=(0<<3)|mask,r=d;for(var i=0;i<10;i++)r=(r<<1)^((r>>>9)*0x537);
      var b=((d<<10)|r)^0x5412;function g(i){return((b>>>i)&1)!==0}
      for(i=0;i<=5;i++)setF(8,i,g(i));setF(8,7,g(6));setF(8,8,g(7));setF(7,8,g(8));
      for(i=9;i<15;i++)setF(14-i,8,g(i));
      for(i=0;i<8;i++)setF(size-1-i,8,g(i));
      for(i=8;i<15;i++)setF(8,size-15+i,g(i));

    }
    fmt(0);
    if(ver>=7){var r2=ver;for(i=0;i<12;i++)r2=(r2<<1)^((r2>>>11)*0x1F25);
      var vb=(ver<<12)|r2;for(i=0;i<18;i++){var c=((vb>>>i)&1)!==0,a=size-11+i%3,b2=Math.floor(i/3);setF(a,b2,c);setF(b2,a,c)}}
    var n=0;
    for(var right=size-1;right>=1;right-=2){
      if(right===6)right=5;
      for(var vert=0;vert<size;vert++)for(var jj=0;jj<2;jj++){
        var x=right-jj,up=((right+1)&2)===0,y=up?size-1-vert:vert;
        if(!F[y][x]&&n<all.length*8){M[y][x]=((all[n>>>3]>>>(7-(n&7)))&1)!==0;n++}

    function applyMask(m){for(var y=0;y<size;y++)for(var x=0;x<size;x++){
      var inv;switch(m){case 0:inv=(x+y)%2===0;break;case 1:inv=y%2===0;break;case 2:inv=x%3===0;break;case 3:inv=(x+y)%3===0;break;
        case 4:inv=(Math.floor(x/3)+Math.floor(y/2))%2===0;break;case 5:inv=x*y%2+x*y%3===0;break;

    function penalty(){

      for(x=0;x<size;x++){run=1;for(y=1;y<size;y++){if(M[y][x]===M[y-1][x]){run++;if(run===5)p+=3;else if(run>5)p++}else run=1}}
      for(y=0;y<size-1;y++)for(x=0;x<size-1;x++){var c=M[y][x];if(c===M[y][x+1]&&c===M[y+1][x]&&c===M[y+1][x+1])p+=3}

  function qrSvg(text){

  }

  // الهدية
  function trimStr(x){return String(x).trim()}
  function showGift(){
    var B=Object.assign({},window.DEFAULTS.bonus,cfg.bonus||{});
    var gb=$("giftBox"),ok=B.enabled!==false&&/^https?:\/\//i.test(B.url||"");
    gb.hidden=!ok; if(!ok) return;
    $("g-title").textContent=B.title;$("g-title").style.display=B.title?"":"none";
    var am=$("g-amt");am.textContent=B.amount;am.style.display=B.amount?"":"none";
    var n=String(B.amount||"").length;am.style.fontSize=(n<=5?68:(n<=8?52:(n<=12?40:30)))+"px";
    $("g-sub").textContent=B.sub;$("g-sub").style.display=B.sub?"":"none";
    var code=B.code||cfg.promoCode||"";
    $("g-codebox").style.display=code?"":"none";
    $("g-cl").textContent=B.codeLabel;$("g-code").textContent=code;
    $("g-hint").textContent=B.hint;$("g-hint").style.display=B.hint?"":"none";
    var lk=$("g-link");lk.href=B.url;lk.textContent=B.openBtn||"اضغط هنا";
    var f=$("g-feat");f.textContent="";
    String(B.features||"").split("\n").map(trimStr).filter(Boolean).slice(0,4).forEach(function(tx){
      var li=document.createElement("li"),p=tx.split("|"),bb=document.createElement("b");bb.textContent=p[0].trim();li.appendChild(bb);
      if(p[1]){var sp=document.createElement("span");sp.textContent=p[1].trim();li.appendChild(sp)}
      f.appendChild(li)});
    f.style.display=f.children.length?"":"none";
  }
  function confetti(){
    if(cfg.animations===false) return;
    var box=$("gconf"),cols=["#ffd54a","#ff6b8b","#5ac8fa","#7cf5a8","#ffffff"];
    for(var i=0;i<28;i++){
      var e=document.createElement("i"),an=-Math.random()*Math.PI,d=50+Math.random()*120;
      e.style.cssText="--dx:"+(Math.cos(an)*d*1.3).toFixed(0)+"px;--dy:"+(Math.sin(an)*d).toFixed(0)+"px;--r:"+(Math.random()*720-360).toFixed(0)+"deg;background:"+cols[i%cols.length]+";animation-delay:"+(Math.random()*.15).toFixed(2)+"s";
      box.appendChild(e);(function(x){setTimeout(function(){x.remove()},1700)})(e);
    }
  }
  $("giftBtn").addEventListener("click",function(){
    var g=$("giftBox"),o=g.classList.toggle("open");
    if(o) confetti();
  });
  $("g-copy").addEventListener("click",function(){copyText($("g-code").textContent,"تم نسخ الكود")});

  // البوسترات
  function okImg(u){return /^(https?:\/\/|assets\/[\w.\-]+$)/i.test(u||"")}
  function showPosters(){
    var box=$("posters");box.textContent="";
    var list=(Array.isArray(cfg.posters)?cfg.posters:[]).filter(function(p){return p&&p.enabled!==false});
    box.hidden=!list.length; if(!list.length) return;
    box.className="posters"+(list.length>1?" multi":"");
    list.forEach(function(p){
      var hasUrl=/^https?:\/\//i.test(p.url||"");
      var el=document.createElement(hasUrl?"a":"div");el.className="poster"+(p.ratio==="4:5"?" r45":"");
      if(hasUrl){el.href=p.url;el.target="_blank";el.rel="noopener"}
      var bg=document.createElement("div");bg.className="pbg";
      if(okImg(p.bg)) bg.style.backgroundImage='url("'+encodeURI(p.bg).replace(/"/g,"%22")+'")';
      var dim=p.dim==null||p.dim===""?45:Math.min(90,Math.max(0,+p.dim||0))/100;
      var ov=document.createElement("div");ov.className="pov";
      ov.style.background="linear-gradient(180deg,rgba(2,6,30,"+(dim*1.1).toFixed(2)+"),rgba(2,6,30,"+(dim*.3).toFixed(2)+") 45%,rgba(2,6,30,"+Math.min(.95,dim*1.5).toFixed(2)+"))";
      el.appendChild(bg);el.appendChild(ov);
      var lg=document.createElement("div");lg.className="plogo";
      if(okImg(p.logoImg)){var li=document.createElement("img");li.alt="";li.src=p.logoImg;lg.appendChild(li)}else lg.textContent=p.logoText||"";
      if(lg.firstChild) el.appendChild(lg); else {var sp0=document.createElement("div");sp0.style.height="24px";el.appendChild(sp0)}
      var mid=document.createElement("div");mid.className="pmid";
      function add(cls,tx,par){if(!tx)return null;var d=document.createElement("div");d.className=cls;d.textContent=tx;(par||mid).appendChild(d);return d}
      add("peye",p.eyebrow);
      var bg2=add("pbig",p.big);
      if(bg2){var n=String(p.big).length;bg2.style.fontSize=(n<=4?80:(n<=5?68:(n<=7?56:(n<=10?44:34))))+"px"}
      add("psub",p.sub);
      if(p.code){
        var pc=document.createElement("span");pc.className="pcode";pc.setAttribute("role","button");
        if(p.codeLabel){var em=document.createElement("em");em.textContent=p.codeLabel;pc.appendChild(em)}
        var cb=document.createElement("b");cb.textContent=p.code;pc.appendChild(cb);
        pc.addEventListener("click",function(e){e.preventDefault();e.stopPropagation();copyText(p.code,"تم نسخ الكود")});
        mid.appendChild(pc);
      }
      el.appendChild(mid);
      var fl=String(p.features||"").split("\n").map(trimStr).filter(Boolean).slice(0,4);
      if(fl.length){
        var fe=document.createElement("div");fe.className="pfeat";
        fl.forEach(function(tx){var d=document.createElement("div"),q=tx.split("|"),b=document.createElement("b");b.textContent=q[0].trim();d.appendChild(b);
          if(q[1]){var s2=document.createElement("span");s2.textContent=q[1].trim();d.appendChild(s2)}fe.appendChild(d)});

      if(p.footer){var ft=document.createElement("div");ft.className="pfoot";ft.textContent=p.footer;el.appendChild(ft)}

  }

  var qrKey="";
  function showExtras(){
    showGift();showPosters();
    var Q=Object.assign({enabled:true,title:"",text:"",url:""},cfg.qr||{});
    var qc=$("qrCard"),okQ=Q.enabled!==false&&/^https?:\/\//i.test(Q.url||"");
    qc.hidden=!okQ; if(!okQ) return;
    qc.href=Q.url;$("q-title").textContent=Q.title||"";$("q-text").textContent=Q.text||"";
    if(qrKey!==Q.url){var h=$("q-svg");h.textContent="";var sv=qrSvg(Q.url);if(sv)h.appendChild(sv);qrKey=Q.url}
  }

  // الجوال والصور
  var phKey="",phTimer=0;
  function showPhone(){
    showPhone0();
    var g=document.querySelector(".glass");
    g.style.marginTop=!$("showcase").hidden?"":($("tiles").children.length?"":"-28px");
  }
  function showPhone0(){
    var P=Object.assign({mode:"phone",tilt:true,crop:true,speed:3.5,images:[]},cfg.phone||{});
    var sc=$("showcase"),scr=$("screen");
    var imgs=(P.images||[]).filter(function(u){return /^(https?:\/\/|assets\/[\w.\-]+$)/i.test(u)});
    var mode=P.mode==="plain"?"plain":(P.mode==="off"?"off":"phone");
    if(mode==="off"||(mode==="plain"&&!imgs.length)){sc.hidden=true;clearInterval(phTimer);phKey="";return}
    sc.hidden=false;
    sc.className="showcase"+(mode==="plain"?" plain":(P.tilt!==false?" tilt":"")+(P.crop!==false?" crop":""));
    var key=JSON.stringify([imgs,P.speed,cfg.title,cfg.subtitle,mode]);
    if(key===phKey) return; phKey=key;
    clearInterval(phTimer); scr.textContent="";
    if(!imgs.length){
      var f=document.createElement("div");f.className="fk";
      var a=document.createElement("small");a.textContent=cfg.highlight||"👋";
      var h=document.createElement("h4");h.textContent=cfg.title||"";
      var p=document.createElement("p");p.textContent=cfg.subtitle||"";
      var b=document.createElement("b");b.textContent="+ "+(cfg.highlight||"انضم الآن");
      var cs=document.createElement("div");cs.className="cs";cs.appendChild(document.createElement("i"));cs.appendChild(document.createElement("i"));
      [a,h,p,b,cs].forEach(function(x){f.appendChild(x)});scr.appendChild(f);return;
    }
    imgs.forEach(function(u,i){var im=document.createElement("img");im.className="slide"+(i?"":" on");im.alt="";im.src=u;im.loading="lazy";scr.appendChild(im)});
    if(imgs.length>1&&cfg.animations!==false){
      var cur=0,sec=Math.min(20,Math.max(1,parseFloat(P.speed)||3.5));
      phTimer=setInterval(function(){var el=scr.children;el[cur].classList.remove("on");cur=(cur+1)%el.length;el[cur].classList.add("on")},sec*1000);
    }
  }

  // خلفية متحركة
  var fx=$("fx"),fctx=fx.getContext("2d"),fW=0,fH=0,fItems=[],fRaf=0,fKey="";
  function fSize(){var d=Math.min(window.devicePixelRatio||1,2);fW=window.innerWidth;fH=window.innerHeight;fx.width=fW*d;fx.height=fH*d;fctx.setTransform(d,0,0,d,0,0)}
  function setBg(m){
    document.body.setAttribute("data-bg",m);
    var key=m+"|"+(cfg.animations===false); if(key===fKey) return; fKey=key;
    cancelAnimationFrame(fRaf); fItems=[]; fSize(); fctx.clearRect(0,0,fW,fH);
    var n={stars:90,particles:36,balls:12}[m]; if(!n) return;
    for(var i=0;i<n;i++) fItems.push({x:Math.random()*fW,y:Math.random()*fH,
      r:m==="stars"?Math.random()*1.6+.4:(m==="balls"?Math.random()*16+18:Math.random()*5+2),
      s:m==="stars"?Math.random()*1.5+.5:Math.random()*.6+.25,p:Math.random()*6.28,a:Math.random()*6.28});
    var still=cfg.animations===false||(window.matchMedia&&matchMedia("(prefers-reduced-motion:reduce)").matches);
    function frame(t){
      fctx.clearRect(0,0,fW,fH);
      var col=(cfg.colors&&cfg.colors.accent2)||"#5ac8fa";
      fItems.forEach(function(o){
        if(!still&&m!=="stars"){o.y-=o.s;o.x+=Math.sin(t/1500+o.p)*.35;o.a+=.01;if(o.y<-40){o.y=fH+40;o.x=Math.random()*fW}}
        if(m==="stars"){fctx.globalAlpha=still?.7:.25+.75*Math.abs(Math.sin(t/900*o.s+o.p));fctx.fillStyle="#fff";fctx.beginPath();fctx.arc(o.x,o.y,o.r,0,6.283);fctx.fill()}
        else if(m==="particles"){fctx.globalAlpha=.35;fctx.fillStyle=col;fctx.shadowColor=col;fctx.shadowBlur=14;fctx.beginPath();fctx.arc(o.x,o.y,o.r,0,6.283);fctx.fill();fctx.shadowBlur=0}
        else{fctx.globalAlpha=.45;fctx.save();fctx.translate(o.x,o.y);fctx.rotate(o.a);fctx.font=o.r+"px serif";fctx.textAlign="center";fctx.textBaseline="middle";fctx.fillText("\u26BD",0,0);fctx.restore()}
      });
      fctx.globalAlpha=1;
      if(!still) fRaf=requestAnimationFrame(frame);
    }
    frame(0);
  }
  window.addEventListener("resize",function(){if(window.innerWidth!==fW){fKey="";render()}});

  render();
  // تحميل الإعدادات المحفوظة من لوحة الأدمن
  try{
    fetch("config.json?v="+Date.now(),{cache:"no-store"})
      .then(function(r){return r.ok?r.json():null})
      .then(function(d){if(d){for(var k in d){cfg[k]=d[k]}render()}})
      .catch(function(){});
  }catch(e){}

  var t=$("toast");
  function toast(msg){t.textContent=msg;t.classList.add("show");setTimeout(function(){t.classList.remove("show")},1800)}
  function copyText(c,msg){
    function fb(){var a=document.createElement("textarea");a.value=c;document.body.appendChild(a);a.select();try{document.execCommand("copy")}catch(e){}document.body.removeChild(a);toast(msg)}
    try{navigator.clipboard&&navigator.clipboard.writeText?navigator.clipboard.writeText(c).then(function(){toast(msg)},fb):fb()}catch(e){fb()}
  }
  $("copyBtn").addEventListener("click",function(){copyText($("code").textContent,"تم نسخ الكود");track("c_promo")});
  $("shareBtn").addEventListener("click",function(){
    var u=location.href;
    if(navigator.share){navigator.share({title:cfg.title,url:u}).catch(function(){})}
    else copyText(u,"تم نسخ الرابط");
  });
})();
